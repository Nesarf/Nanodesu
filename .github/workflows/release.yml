# Publish Nanodesu on a tag.
#
# Two artifacts from one tag: the tool itself to PyPI (so `pip install nanodesu` works), and the
# signed standalone executable to the GitHub Release (so someone can run it without a Python).
#
# PyPI publication uses **Trusted Publishing**, not a token: the runner asks GitHub for an OIDC
# token, PyPI verifies it came from this repository, this workflow file and the environment named
# below, and issues a short-lived upload credential. Nothing secret is stored anywhere.
#
# The environment name is pinned here so that what the PyPI settings page must say is unambiguous.
# A mismatch between this string and the publisher configured on PyPI is the most common way this
# fails, and it fails at the last step of a release, after everything else has gone green.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read            # default for the whole workflow; jobs widen it where they need to

jobs:
  # --------------------------------------------------------------------------------------- #
  # PyPI: build the sdist and wheel, check them, then publish through OIDC.
  # --------------------------------------------------------------------------------------- #
  pypi:
    name: build and publish to PyPI
    runs-on: ubuntu-latest
    env:
      PYPI_NAME: nanodesu
    environment:
      name: pypi
      url: https://pypi.org/p/nanodesu
    permissions:
      id-token: write       # required for Trusted Publishing; without it the upload is refused
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the build tooling
        run: python -m pip install --upgrade build twine

      - name: The tag must match the version in pyproject.toml
        # A release whose tag disagrees with the metadata publishes something nobody can find by
        # version later. Cheap to check, unpleasant to discover afterwards.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag declared=$declared"
          test "$tag" = "$declared" || { echo "::error::tag $tag does not match version $declared"; exit 1; }

      - name: The suite must pass before anything is published
        # The tests workflow runs on every push, but a tag can be pushed at a commit whose run was
        # red, skipped, or never made. This reads the result rather than assuming it.
        run: python -m unittest discover -s test

      - name: Build
        run: python -m build

      - name: The sdist can run its own suite
        # **The gate that was missing.** 1.7.5 shipped an sdist carrying `test/test_*.py` and not
        # `test/spawn_guard.py`, `FORMAT_MATRIX.md` or `PERSONA.md`: unpacked and run, eight modules failed
        # at import and three tests errored -- while the same suite was green above, because the checkout
        # **is** the repository.
        #
        # `mktemp` rather than a fixed path: a directory left by an earlier run would let this pass on
        # files that are no longer the ones in `dist/`.
        run: |
          tmp=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$tmp"
          cd "$tmp"/*/
          python -m unittest discover -s test

      - name: Validate the distributions
        run: python -m twine check dist/*

      - name: List what is actually in the wheel, and refuse a missing part
        # A build that succeeds says nothing about its contents: a release once shipped without a
        # module it needed, and every check passed. Printing the list costs nothing -- but printing it
        # was all this step did, so a missing file went out anyway. It asserts now, and it names the
        # window's three parts, which are the newest thing that can go missing: the module, and the
        # two JSON files that travel as `data-files` under `<prefix>/share/nanodesu` with the version
        # in the path (matched by suffix so this does not pin the version).
        run: |
          python - <<'PY'
          import glob, zipfile
          names = set()
          for wheel in sorted(glob.glob("dist/*.whl")):
              print(wheel)
              for name in zipfile.ZipFile(wheel).namelist():
                  print("   ", name)
                  names.add(name)
          required = {"nanodesu.py", "neutralize.py", "boundary.py",
                      "boundary_voice.py", "panel_window.py"}
          missing = sorted(required - names)
          for wanted in ("share/nanodesu/panel.json", "share/nanodesu/font.json"):
              if not any(n.endswith(wanted) for n in names):
                  missing.append(wanted)
          if missing:
              raise SystemExit("the wheel is missing %s" % missing)
          print("every required entry is present")
          PY

      - name: The installed wheel can paint its own panel
        # The branch nobody exercises by developing from a clone: `embedded()` looks beside the module
        # first and then in `<prefix>/share/nanodesu`, and only the second one exists after
        # `pip install`. Installed from a directory that is not the checkout, because a path relative
        # to the working directory passes here and fails for every user.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --quiet dist/*.whl Pillow
          cd /tmp
          /tmp/verify/bin/python - <<'PY'
          import pathlib, sysconfig
          import panel_window as pw
          share = pathlib.Path(sysconfig.get_path("data")) / "share" / "nanodesu"
          layout = pw.load(str(share / "panel.json"))
          draw = pw.load_font(str(share / "font.json"))
          image = layout.image(["the installed copy paints its own panel"], title="RELEASE", draw_fn=draw)
          assert image.size[0] > 0 and image.size[1] > 0, image.size
          print("painted %s from %s" % (image.size, share))
          PY

      - name: Is this version already on PyPI?
        # PyPI refuses to overwrite a published file, which is correct of it and is what makes a
        # release trustworthy. The consequence for CI is that re-running this workflow for an
        # already-published version used to fail at the last step -- a red X on a finished release,
        # which teaches people to ignore red Xs. So the upload is skipped with an explanation
        # instead, and the job reports success because the end state is the one it wanted.
        id: exists
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/${PYPI_NAME}/${version}/json")
          if [ "$code" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PYPI_NAME} ${version} is already published; skipping the upload"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "${PYPI_NAME} ${version} is not published yet (HTTP $code)"
          fi

      - name: Publish to PyPI
        if: steps.exists.outputs.already == 'false'
        uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74b5c70  # release/v1
        with:
          # Nothing to configure: the action finds the OIDC token in the environment and PyPI
          # matches it against the publisher registered for this repository and workflow.
          packages-dir: dist/

      - name: Report the outcome
        run: |
          if [ "${{ steps.exists.outputs.already }}" = "true" ]; then
            echo "::notice::this run published nothing: the version was already on PyPI"
          else
            echo "published ${PYPI_NAME} ${GITHUB_REF_NAME#v} to PyPI"
          fi

  # --------------------------------------------------------------------------------------- #
  # GitHub Release: the standalone Windows executable, unsigned.
  # --------------------------------------------------------------------------------------- #
  executable:
    name: build the standalone executable
    runs-on: windows-latest
    # Without this the upload races the release creation: the two jobs are independent, GitHub runs
    # them concurrently, and `gh release upload` against a release that does not exist yet fails.
    needs: release-notes
    permissions:
      contents: write       # to attach the asset to the release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build the onefile executable
        # `--add-data` is not decoration: a onefile build carries its modules and not the files beside
        # them, so without these two the window's data would be missing from this artifact while
        # working perfectly from a checkout. Both land inside the bundle, which is where `embedded()`
        # looks first (`dirname(__file__)` is the bundle root in a onefile build).
        run: >
          python -m PyInstaller --onefile --name nanodesu --console
          --add-data "panel.json;." --add-data "font.json;."
          nanodesu.py

      - name: Sanity-check that it runs
        # An executable that cannot print its own help is not a release artifact.
        run: .\dist\nanodesu.exe --help

      - name: The window's data has to be inside the executable
        # `--help` passes whether or not these two files are in the bundle, so it cannot see this. What
        # a missing pair does is quieter than a crash: `--window` falls back to printing the report,
        # which is the designed degradation and also indistinguishable from a user who asked for a
        # window and got one that never opened.
        run: |
          $listing = pyi-archive_viewer -l dist\nanodesu.exe | Out-String
          foreach ($name in @("panel.json", "font.json")) {
            if ($listing -notmatch [regex]::Escape($name)) {
              throw "$name is not inside nanodesu.exe; --window would print instead of painting"
            }
            Write-Output "$name is inside the executable"
          }

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" dist/nanodesu.exe --clobber

      - name: Say plainly that this artifact is unsigned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --json body --jq .body > body.md
          @"

          ---

          ### The standalone .exe from this workflow is unsigned

          The published ``.whl`` and ``.tar.gz`` on PyPI are the primary artifact and need no
          signature: ``pip`` verifies them against the index hashes. The Windows executable
          attached here is built by CI and carries **no Authenticode signature**, because the
          signing certificate's private key deliberately does not exist in CI.

          Signed builds are produced locally through the project's own signing pipeline. If a
          signature matters for your use, build from source or use the PyPI package.
          "@ | Out-File -Append -Encoding utf8 body.md
          gh release edit "$env:GITHUB_REF_NAME" --notes-file body.md

  # --------------------------------------------------------------------------------------- #
  # GitHub Release: created from the notes committed for this version.
  # --------------------------------------------------------------------------------------- #
  release-notes:
    name: create the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Create the release with the notes committed for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="RELEASE_NOTES_${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is not in the tree; a release without notes is one nobody can review later"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Nanodesu! ${version}" \
              --notes-file "$notes" \
              --verify-tag
          fi
