name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. This workflow only reads the repository and runs the test suite, so
# it needs nothing else. A token with write access is a token a compromised dependency can
# use against the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13", "3.14"]

    steps:
      # Actions are pinned to a commit SHA rather than a tag. A tag is a movable pointer: if
      # the upstream action is compromised or retagged, a workflow referencing @v4 runs
      # whatever that tag points at on the next run. The SHA cannot move. The trailing
      # comment names the release the SHA corresponds to.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683     # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile the tool
        run: python -m py_compile nanodesu.py tools/charlayer.py

      - name: Run the test suite
        run: python -m unittest discover -s test -v

      - name: Self-test the character canvas (no Qt required)
        run: python tools/charlayer.py

      - name: Command line smoke test
        run: |
          python nanodesu.py --help
          python nanodesu.py info --help
