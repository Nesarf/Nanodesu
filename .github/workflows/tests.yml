name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter
        run: python -V

      - name: Byte-compile the tool
        run: python -m py_compile nanodesu.py tools/charlayer.py

      - name: Run the test suite
        run: python -m unittest discover -s test -v

      - name: Self-test the character canvas (no Qt required)
        run: python tools/charlayer.py

      - name: Command line smoke test
        run: |
          python nanodesu.py --help
          python nanodesu.py info --help
