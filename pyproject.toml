[project]
name = "nanodesu"
version = "1.3.1"
description = "Unpack and repack PyInstaller single-file executables (standard library only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pyinstaller", "unpacker", "reverse-engineering", "carchive", "pyz"]
dependencies = []

[project.scripts]
nanodesu = "nanodesu:main"

[project.urls]
# The PyPI page had no links at all: nowhere to go for the source, the issue tracker or the
# changelog. For a project whose purpose is to be useful to somebody who just found it, a
# dead-end page is the wrong first impression.
Homepage = "https://github.com/Nesarf/Nanodesu"
Repository = "https://github.com/Nesarf/Nanodesu"
Issues = "https://github.com/Nesarf/Nanodesu/issues"
Changelog = "https://github.com/Nesarf/Nanodesu/releases"

[tool.setuptools]
py-modules = ["nanodesu"]

[tool.setuptools.package-data]
"*" = ["README.md", "LICENSE"]
